services:
  - type: web
    name: ai-nurse
    env: node
    region: frankfurt          # Evropa (O'zbekistonga eng yaqin)
    plan: free
    buildCommand: npm install && NITRO_PRESET=node-server npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NITRO_PRESET
        value: "node-server"
      - key: NODE_VERSION
        value: "20"
      - key: SUPABASE_PROJECT_ID
        sync: false            # Render dashboard'dan qo'lda kiritilas
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # MAXFIY — faqat dashboard'dan kiriting!
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
